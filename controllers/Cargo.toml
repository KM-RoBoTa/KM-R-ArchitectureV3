[package]
name = "controllers"
description = "Where robot controllers are written. Depends on kmr_api only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kmr_api.workspace = true

[features]
# The Dynamixel SDK, for the bench. Off: the crate builds anywhere and simulates.
hardware = ["kmr_api/dynamixel"]
# The RX-28 chain, `robot!(Rx28Chain)`: ten actuators. Dev bench stopgap until
# N is a const generic (core M2).
rx28 = ["kmr_api/joints-10"]

[lints]
workspace = true
