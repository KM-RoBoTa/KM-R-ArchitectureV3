[package]
name = "controllers"
description = "Where robot controllers are written. Depends on kmr_api only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kmr_api.workspace = true

[features]
# The Dynamixel SDK and the XIAO's microphone, for the bench. Off: the crate builds anywhere and
# simulates.
hardware = ["kmr_api/dynamixel", "kmr_api/xiao"]
# Hot-plug of declared actuators, `kmr_api::experimental`: the runtime_actuators example.
experimental = ["kmr_api/experimental"]
# Controllers written in Python: `kmr_api::python!` (needs the Python headers and library).
python = ["kmr_api/python"]
# Controllers written in Lua: `kmr_api::lua!` (Lua 5.4, vendored).
lua = ["kmr_api/lua"]
# Controllers written in C and C++: build.rs compiles c/ and cpp/ (needs a C and a C++ compiler).
# DECISION: one feature for both languages: a C++ controller is a C function, and every toolchain
# that has one compiler has the other.
c = ["kmr_api/ffi", "dep:kmr_api"]
# DECISION: kept as a no-op so the RX-28 command line in main.rs still works:
# `robot!(Rx28Chain)` alone sets N = 10 now (core M2).
rx28 = []

# The build helper alone, for build.rs: compiles the C and C++ controllers under feature `c`.
[build-dependencies]
kmr_api = { workspace = true, features = ["ffi-build"], optional = true }

# The C and C++ clap tests drive scripted ticks through kmr_api's test hooks.
[dev-dependencies]
kmr_api = { workspace = true, features = ["test-util"] }

# The clap controller of src/main.rs with its logic in python/clap.py.
[[example]]
name = "clap_py"
required-features = ["python"]

# The clap controller of src/main.rs with its logic in lua/clap.lua.
[[example]]
name = "clap_lua"
required-features = ["lua"]

# The clap controller of src/main.rs with its logic in c/clap.c.
[[example]]
name = "clap_c"
required-features = ["c"]

# The clap controller of src/main.rs with its logic in cpp/clap.cpp.
[[example]]
name = "clap_cpp"
required-features = ["c"]

# The clap controller of src/main.rs without the microphone, actuators plugged and unplugged at run time.
[[example]]
name = "runtime_actuators"
required-features = ["hardware", "experimental"]

# c/clap.c and cpp/clap.cpp over scripted ticks, with a fake microphone.
[[test]]
name = "clap"
required-features = ["c"]

[lints]
workspace = true
