[package]
name = "controllers"
description = "Where robot controllers are written. Depends on kmr_api only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kmr_api.workspace = true

[features]
# The Dynamixel SDK, for the bench. Off: the crate builds anywhere and simulates.
hardware = ["kmr_api/dynamixel"]
# DECISION: kept as a no-op so the RX-28 command line in main.rs still works:
# `robot!(Rx28Chain)` alone sets N = 10 now (core M2).
rx28 = []

[lints]
workspace = true
