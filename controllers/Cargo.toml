[package]
name = "controllers"
description = "Where robot controllers are written. Depends on kmr_api only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kmr_api.workspace = true

[features]
# The Dynamixel SDK and the XIAO's microphone, for the bench. Off: the crate builds anywhere and
# simulates.
hardware = ["kmr_api/dynamixel", "kmr_api/xiao"]
# Controllers written in Python: `kmr_api::python!` (needs the Python headers and library).
python = ["kmr_api/python"]
# Controllers written in Lua: `kmr_api::lua!` (Lua 5.4, vendored).
lua = ["kmr_api/lua"]
# DECISION: kept as a no-op so the RX-28 command line in main.rs still works:
# `robot!(Rx28Chain)` alone sets N = 10 now (core M2).
rx28 = []

# The clap controller of src/main.rs with its logic in python/clap.py.
[[example]]
name = "clap_py"
required-features = ["python"]

# The clap controller of src/main.rs with its logic in lua/clap.lua.
[[example]]
name = "clap_lua"
required-features = ["lua"]

[lints]
workspace = true
