[package]
name = "kmr_ffi"
description = "Plain C types, headers and script bridges that let a kmr controller hand its math to C, C++, Python or Lua."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No engine dependency (research R9): kmr_api depends on this crate, never the reverse.
# kmr_model_core depends on no kmr crate; the build helper reads N through it (decision 0009).
[dependencies]
thiserror.workspace = true
cc = { workspace = true, optional = true }
kmr_model_core = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
mlua = { workspace = true, optional = true }

# All off by default: a build without them compiles no foreign-language code.
[features]
build = ["dep:cc", "dep:kmr_model_core"]
python = ["dep:pyo3"]
lua = ["dep:mlua"]

[lints]
workspace = true

# cc and kmr_model_core again, so `cargo test` checks the build helper without the `build`
# feature.
[dev-dependencies]
cc.workspace = true
kmr_model_core.workspace = true
