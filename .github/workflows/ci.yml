name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmr_v3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kmr_v3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # --workspace: the root package has no tests, kmr_core holds them all.
      - run: cargo test --workspace

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmr_api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kmr_api
      # Committed manifest is the dev one (kmr_core by path), so this builds
      # against the core source in the same checkout.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
