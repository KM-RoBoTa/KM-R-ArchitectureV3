name: Human authorship

# Not an anti-AI policy: AI tools are tolerated (see CONTRIBUTING.md). This
# only forbids crediting an AI as author/co-author of a commit, so every commit
# carries explicit human accountability (AGENTS.md, rule b).

on:
  pull_request:

permissions:
  contents: read

jobs:
  human-authorship:
    name: human-authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI co-attribution in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Forbidden in the commit MESSAGE (co-author trailers, "generated
          # with" footers).
          MESSAGE_PATTERNS=(
            'co-authored-by:.*claude'
            'co-authored-by:.*anthropic'
            'co-authored-by:.*chatgpt'
            'co-authored-by:.*openai'
            'co-authored-by:.*\bcodex\b'
            'co-authored-by:.*copilot'
            'co-authored-by:.*cursor'
            'co-authored-by:.*gemini'
            'co-authored-by:.*\bgpt\b'
            'co-authored-by:.*noreply@anthropic\.com'
            'co-authored-by:.*<[^>]*\bai\b[^>]*bot'
            'generated with \[?claude'
            'generated by claude'
            'generated with \[?chatgpt'
            'generated with \[?copilot'
            '🤖 generated with'
          )

          # Forbidden in the author/committer IDENTITY. Agents such as Cursor's
          # can commit as "Cursor Agent <cursoragent@cursor.com>", which never
          # shows up in a trailer; bare "cursor" catches name and domain.
          IDENTITY_PATTERNS=(
            'cursor'
            'anthropic\.com'
            'claude'
            'chatgpt'
            '@openai\.com'
            'copilot'
            'gemini'
          )

          fail=0
          commits="$(git log --no-merges --format='%H' "$BASE_SHA".."$HEAD_SHA")"
          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          while read -r sha; do
            [ -z "$sha" ] && continue
            msg="$(git log -1 --format='%B' "$sha")"
            identity="$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$sha")"
            short="$(git log -1 --format='%h %s' "$sha")"

            for p in "${MESSAGE_PATTERNS[@]}"; do
              if printf '%s' "$msg" | grep -iqE "$p"; then
                echo "::error::AI attribution in message of $short (pattern: $p)"
                printf '%s' "$msg" | grep -iE "$p" | sed 's/^/    | /'
                fail=1
              fi
            done

            for p in "${IDENTITY_PATTERNS[@]}"; do
              if printf '%s' "$identity" | grep -iqE "$p"; then
                echo "::error::AI author/committer on $short (pattern: $p)"
                printf '%s' "$identity" | grep -iE "$p" | sed 's/^/    | /'
                fail=1
              fi
            done
          done <<< "$commits"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more commits credit an AI as (co-)author."
            echo "AI tools are tolerated, but each commit must be attributed to"
            echo "the human who stands behind it (AGENTS.md, rule b)."
            echo "Reword the commit message(s) and force-push the PR branch."
            exit 1
          fi

          echo "OK: no AI co-attribution found."
