[package]
name = "kmr_core"
description = "The kmr engine: state, schedules, control loop, timing and signals."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
rstest.workspace = true
circular-buffer.workspace = true
# `termination`: SIGTERM and SIGHUP raise `shutdown!` like Ctrl-C.
ctrlc = { workspace = true, features = ["termination"] }
tracing.workspace = true
tracing-subscriber.workspace = true
derive_more.workspace = true
frunk.workspace = true

# The real-time sleep of the loop: absolute `clock_nanosleep` on the
# monotonic clock (SRS FR-3.2). Safe API; already a workspace dependency.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["thread", "time"] }

[features]
# Test hooks for the crates built on top of the core: record a sensed sample,
# read the desired buffer back, and drive the runtime with a scripted host and
# a recording adapter (`kmr_core::test_util`). Off by default, and only ever enabled from
# a `[dev-dependencies]` entry, so no release build carries a way to forge a
# sample or to read the write-only staging area.
test-util = []
# Batches keep declaration order instead of group order: the bench's
# baseline for the presort (SRS FR-5.3). Off by default.
presort-off = []

[lints]
workspace = true
