[workspace]
resolver = "3"
members = ["kmr_core", "kmr_api", "controllers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KM-RoBoTa/KM-R-ArchitectureV3"

[workspace.dependencies]
kmr_core = { path = "kmr_core" }
kmr_api = { path = "kmr_api" }

thiserror = "2.0.18"
rstest = "0.26.1"
ctrlc = "3.5.2"
circular-buffer = "2.0.0"
derive_more = { version = "2.1.1", features = ["add", "mul"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
frunk = "0.5.0"
color-eyre = { version = "0.6", default-features = false }
