[package]
name = "kmr_api"
version = "0.1.0"
edition = "2024"

# Standalone: kmr_api is its OWN workspace, outside the closed kmr_core repo.
[workspace]

[dependencies]
thiserror = "2.0.18"
derive_more = { version = "2.1.1", features = ["add", "mul"] }
# DEV ONLY — real kmr_core source, for cargo build/check + rust-analyzer.
# NEVER ships: scripts/run-prod.sh restores the rlib-only Cargo.toml before
# any release build, and this file is not part of the customer tarball.
kmr_core = { path = "../kmr_v3/src/kmr_core" }

[dev-dependencies]
color-eyre = { version = "0.6", default-features = false }

[[example]]
name = "complete_api_example"
