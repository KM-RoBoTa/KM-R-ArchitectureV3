[package]
name = "kmr_api"
description = "The public kmr API: write robot controllers as plain functions on schedules."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kmr_core.workspace = true
kmr_adapters.workspace = true
kmr_model.workspace = true
thiserror.workspace = true
kmr_ffi = { workspace = true, optional = true }

[features]
dynamixel = ["kmr_adapters/dynamixel"]
# Foreign-language controller math (kmr_ffi), all off by default: without them no FFI code is
# compiled (FR-072 (SRS FR-10)).
ffi = ["dep:kmr_ffi"]
# For a build-dependency: `kmr_api::ffi::build`, the helper that compiles C and C++ sources.
ffi-build = ["ffi", "kmr_ffi/build"]
# Scripted runs for tests: `kmr_api::test_util`, the core's scripted host and recording adapter.
test-util = ["kmr_core/test-util"]

[dev-dependencies]
# Same crate as above, plus the test hooks: the group tests need a populated
# history and a readable desired buffer, which the normal surface never gives.
kmr_core = { workspace = true, features = ["test-util"] }
color-eyre.workspace = true
# Compile-fail cases of kmr_api/tests/ui/ (SC-008 (SRS NFR-3)).
trybuild.workspace = true

[[example]]
name = "complete_api_example"

[lints]
workspace = true
