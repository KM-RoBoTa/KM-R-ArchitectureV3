[package]
name = "kmr_api"
description = "The public kmr API: write robot controllers as plain functions on schedules."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kmr_core.workspace = true
kmr_adapters.workspace = true
kmr_model.workspace = true
thiserror.workspace = true

[features]
dynamixel = ["kmr_adapters/dynamixel"]
# Batches keep declaration order: the bench's baseline for the presort (SRS
# FR-5.3; assumed, pending human: D11 B). Off by default.
presort-off = ["kmr_core/presort-off"]

[dev-dependencies]
# Same crate as above, plus the test hooks: the group tests need a populated
# history and a readable desired buffer, which the normal surface never gives.
kmr_core = { workspace = true, features = ["test-util"] }
color-eyre.workspace = true
# Compile-fail cases of kmr_api/tests/ui/ (SC-008 (SRS NFR-3)).
trybuild.workspace = true

[[example]]
name = "complete_api_example"

[lints]
workspace = true
