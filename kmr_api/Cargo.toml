[package]
name = "kmr_api"
description = "The public kmr API: write robot controllers as plain functions on schedules."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kmr_core.workspace = true
kmr_adapters.workspace = true
kmr_model.workspace = true
thiserror.workspace = true
triple_buffer.workspace = true
kmr_ffi = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# DECISION (maintainer-asked 2026-11-16, experiment/ffi-bounderies): the embedded CPython of
# `kmr_api::python`, feature `python`.
pyo3 = { workspace = true, optional = true }
# DECISION (maintainer-asked 2026-11-16, experiment/ffi-bounderies): the embedded Lua 5.4 of
# `kmr_api::lua`, feature `lua`; the workspace's mlua, vendored.
mlua = { workspace = true, optional = true }

[features]
dynamixel = ["kmr_adapters/dynamixel"]
# Batches keep declaration order: the bench's baseline for the presort (SRS
# FR-5.3; assumed, pending human: D11 B). Off by default.
presort-off = ["kmr_core/presort-off"]
# C and C++ controllers, `kmr_api::c!` (kmr_ffi). The ffi features are all off by default: without
# them no FFI code is compiled (FR-072 (SRS FR-10)).
ffi = ["dep:kmr_ffi"]
# For a build-dependency: `kmr_api::ffi::c::build`, the helper that compiles C and C++ sources.
ffi-build = ["ffi", "kmr_ffi/build"]
# A Python file as a controller: `kmr_api::python!` (needs the Python headers and library).
python = ["dep:pyo3"]
# A Lua file as a controller: `kmr_api::lua!` (Lua 5.4, vendored: no system library).
lua = ["dep:mlua"]
# Scripted runs for tests: `kmr_api::test_util`, the core's scripted host and recording adapter.
test-util = ["kmr_core/test-util"]
cubemars = ["kmr_adapters/cubemars"]
# The XIAO nRF52840 Sense's IMU and microphone as a sensor, `kmr_api::xiao` (SRS FR-5.7). Off by
# default: without it nothing of xiao-api is compiled.
xiao = ["kmr_adapters/xiao"]
# The Zenoh gateway plugin, `kmr_api::Gateway` (SRS FR-7.1). Off by default: without it no
# Zenoh crate is compiled (SC-004).
zenoh = ["dep:zenoh", "dep:tracing"]

[dev-dependencies]
# Same crate as above, plus the test hooks: the group tests need a populated
# history and a readable desired buffer, which the normal surface never gives.
kmr_core = { workspace = true, features = ["test-util"] }
color-eyre.workspace = true
# Compile-fail cases of kmr_api/tests/ui/ (SC-008 (SRS NFR-3)).
trybuild.workspace = true
# The remote peer of kmr_api/tests/zenoh.rs, in the test process.
zenoh.workspace = true

[[example]]
name = "complete_api_example"

# The XIAO's gyroscope over USB, logged by a controller.
[[example]]
name = "xiao_imu"
required-features = ["xiao"]

# The gateway against an in-process peer on loopback.
[[test]]
name = "zenoh"
required-features = ["zenoh", "test-util"]

# Python controllers on the core's scripted host.
[[test]]
name = "python"
required-features = ["python", "test-util"]

# Lua controllers on the core's scripted host.
[[test]]
name = "lua"
required-features = ["lua", "test-util"]

# Sensors on the core's scripted host and fake sensor.
[[test]]
name = "sensors"
required-features = ["test-util"]

[lints]
workspace = true
