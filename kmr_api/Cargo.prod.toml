[package]
name = "kmr_api"
version = "0.1.0"
edition = "2024"

# Standalone: kmr_api is its OWN workspace, outside the closed kmr_core repo.
[workspace]

[dependencies]
thiserror = "2.0.18"
derive_more = { version = "2.1.1", features = ["add", "mul"] }
# kmr_core intentionally absent — linked as a closed rlib via
# .cargo/config.toml rustflags (--extern kmr_core=...rlib). Never add a
# path/registry dependency here; that would ship kmr_core source.

[[example]]
name = "complete_api_example"
